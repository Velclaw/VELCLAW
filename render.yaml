services:
  - type: web
    name: velclaw
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NEXT_PUBLIC_AUTH_PROVIDERS
        value: github
      - key: NEXT_PUBLIC_GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: JWE_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: VELCLAW_DEPLOY_API_TOKEN
        sync: false
      - key: VELCLAW_PUBLIC_ORIGIN
        sync: false
      - key: VELCLAW_OAUTH_ISSUER
        sync: false
      - key: VELCLAW_APP_ORIGIN
        sync: false
      - key: VELCLAW_API_ORIGIN
        sync: false
      - key: VELCLAW_DOCS_ORIGIN
        sync: false
      - key: VELCLAW_ALLOWED_ORIGINS
        sync: false
      - key: VELCLAW_PUBLIC_DOMAIN
        sync: false
      - key: VELCLAW_TLS_EMAIL
        sync: false
