name: Velclaw Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velclaw-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify Node runtime
        working-directory: repo
        run: |
          set -euo pipefail
          node --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 22) process.exit(1)"

      - name: Set up pnpm
        working-directory: repo
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: repo
        run: pnpm type-check

      - name: Runtime validation
        working-directory: repo
        run: pnpm validate:runtime

      - name: Lint
        working-directory: repo
        run: pnpm lint

      - name: Normalize formatting
        working-directory: repo
        run: pnpm format

      - name: Commit formatting fixes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "velclaw-ci"
          git config user.email "velclaw-ci@users.noreply.github.com"
          git add -- '*.ts' '*.tsx'
          git commit -m "style: apply prettier formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Format check
        working-directory: repo
        run: pnpm format:check

      - name: Test
        working-directory: repo
        run: pnpm test

      - name: Build
        working-directory: repo
        run: pnpm build

      - name: Build production container
        working-directory: repo
        run: docker build --pull --tag velclaw:ci .

      - name: Inspect production container
        working-directory: repo
        run: docker image inspect velclaw:ci >/dev/null
