name: Velclaw AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Gito
        run: python -m pip install --disable-pip-version-check 'gito.bot~=4.4'

      - name: Run Gito review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_TYPE: ${{ vars.LLM_API_TYPE || 'openai' }}
          MODEL: ${{ vars.LLM_MODEL || 'gpt-5.5' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo 'AI review skipped: LLM_API_KEY is not configured.'
            exit 0
          fi
          if ! gito --verbose review; then
            echo 'AI review unavailable. Core CI remains authoritative.'
            exit 0
          fi
          gito github-comment --token "$GITHUB_TOKEN"

      - name: Publish review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velclaw-review-report
          path: |
            code-review-report.md
            code-review-report.json
          if-no-files-found: ignore
