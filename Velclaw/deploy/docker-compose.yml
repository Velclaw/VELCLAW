services:
  velclaw-deploy-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      VELCLAW_DEPLOY_POLL_MS: ${VELCLAW_DEPLOY_POLL_MS:-3000}
      VELCLAW_DEPLOY_PACKAGE_MANAGER: ${VELCLAW_DEPLOY_PACKAGE_MANAGER:-pnpm}
    volumes:
      - velclaw-deploy-work:/work
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

volumes:
  velclaw-deploy-work:
