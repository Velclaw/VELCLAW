#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - openssh-client

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - install -d -m 0755 /opt/velclaw
  - git clone --depth 1 --branch main https://github.com/Velclaw/Velclaw.git /opt/velclaw/repo
  - cd /opt/velclaw/repo && docker compose -f deploy/docker-compose.selfhosted.yml up -d --build
