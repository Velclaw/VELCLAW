<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Velclaw · Workspace</title>
<style>
:root {
  --ink: #14171c;
  --surface: #1b1f26;
  --border: #2a2f38;
  --border-strong: #3a4048;
  --text: #e8eaed;
  --text-muted: #8b93a1;
  --text-dim: #5a6270;
  --amber: #f5a623;
  --amber-10: rgba(245, 166, 35, 0.1);
  --amber-15: rgba(245, 166, 35, 0.15);
  --teal: #4fd1c5;
  --teal-15: rgba(79, 209, 197, 0.15);
  --error: #e5484d;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

button, select, textarea {
  font-family: inherit;
  color: inherit;
}

/* ---------- App shell ---------- */

.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--ink);
}

.panel {
  display: none;
  flex-direction: column;
  min-height: 0;
  flex: 1;
}

.panel.active {
  display: flex;
}

/* ---------- Bottom nav ---------- */

.bottom-nav {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
}

.nav-btn svg {
  width: 20px;
  height: 20px;
}

.nav-btn.active {
  color: var(--amber);
}

.nav-label {
  font-size: 11px;
}

/* ---------- Files panel ---------- */

.files-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  padding: 4px;
}
.icon-btn:hover { color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

.file-title {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  text-align: center;
}

.dirty-dot { color: var(--amber); }

.save-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--teal);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  padding: 4px 8px;
}
.save-btn:disabled {
  color: var(--text-dim);
  cursor: default;
}
.save-btn svg { width: 14px; height: 14px; }

#codeArea {
  flex: 1;
  width: 100%;
  resize: none;
  background: var(--ink);
  border: none;
  outline: none;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
}

/* File tree drawer */

.drawer-overlay {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 20;
}
.drawer-overlay.open { display: flex; }

.drawer {
  width: 80%;
  max-width: 300px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
}
.drawer-header span {
  font-size: 13px;
  font-weight: 500;
}

.drawer-backdrop {
  flex: 1;
  background: rgba(0, 0, 0, 0.5);
  border: none;
}

.tree {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  list-style: none;
  margin: 0;
}
.tree ul { list-style: none; margin: 0; padding: 0; }

.tree-dir-btn, .tree-file-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  padding: 6px 8px;
  text-align: left;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
}
.tree-dir-btn:hover, .tree-file-btn:hover { color: var(--text); }
.tree-dir-btn svg, .tree-file-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.tree-file-btn span { font-family: var(--font-mono); font-size: 13px; }

.tree-file-btn.active {
  border-left-color: var(--amber);
  background: var(--amber-10);
  color: var(--text);
}

/* ---------- Chat panel ---------- */

.chat-header {
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
.chat-header .title {
  font-size: 13px;
  font-weight: 500;
}
.chat-header .status {
  margin-left: 8px;
  font-size: 12px;
  color: var(--teal);
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg-row {
  display: flex;
  gap: 8px;
}
.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.avatar svg { width: 14px; height: 14px; }
.avatar.user { background: var(--amber-15); color: var(--amber); }
.avatar.agent { background: var(--teal-15); color: var(--teal); }

.bubble {
  max-width: 78%;
  padding: 8px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.5;
}
.bubble.user {
  background: var(--amber-10);
  color: var(--text);
  border-top-right-radius: 4px;
}
.bubble.agent {
  background: var(--surface);
  color: var(--text);
  border-top-left-radius: 4px;
}

.typing {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-left: 4px;
  color: var(--text-muted);
  font-size: 13px;
}
.typing svg { width: 14px; height: 14px; color: var(--teal); }

.chat-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding: 12px;
}

#chatInput {
  flex: 1;
  max-height: 112px;
  resize: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--text);
  outline: none;
}
#chatInput::placeholder { color: var(--text-dim); }
#chatInput:focus { border-color: rgba(245, 166, 35, 0.5); }

.send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--amber);
  color: var(--ink);
  border: none;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.send-btn:disabled {
  background: var(--border);
  color: var(--text-dim);
  cursor: default;
}
.send-btn svg { width: 16px; height: 16px; }

/* ---------- Dashboard panel ---------- */

.dashboard {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.status-highlight {
  background: var(--amber-10);
  padding: 12px 16px;
}
.status-highlight .label {
  font-size: 12px;
  color: var(--text-muted);
  margin: 0 0 2px;
}
.status-highlight .value {
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--amber);
  margin: 0;
}

.card {
  border: 1px solid var(--border);
  background: var(--surface);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
}
.card-header svg { width: 16px; height: 16px; color: var(--text-muted); }
.card-header span { font-size: 13px; font-weight: 500; }

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-left: 2px solid var(--border-strong);
  padding: 10px 16px;
}
.status-row.active { border-left-color: var(--teal); }
.status-row .name { font-family: var(--font-mono); font-size: 13px; }
.status-row svg { width: 16px; height: 16px; }
.status-row.active svg { color: var(--teal); }
.status-row:not(.active) svg { color: var(--text-dim); }

.config-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
}
.config-row .config-label { font-size: 13px; color: var(--text-muted); }

#modelSelect {
  background: var(--ink);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text);
}

.link-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  background: none;
  border: none;
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  text-align: left;
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
}
.link-row:hover { color: var(--text); }
.link-row svg { width: 16px; height: 16px; }

.log-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border-left: 2px solid var(--border-strong);
  padding: 10px 16px;
}
.log-row.error { border-left-color: var(--error); }
.log-row .time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.log-row .text { font-size: 13px; color: var(--text-muted); }
.log-row.error .text { color: var(--error); }
</style>
</head>
