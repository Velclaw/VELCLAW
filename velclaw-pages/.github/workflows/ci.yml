name: Velclaw Workspace CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check app.js
          find api -name '*.js' -print0 | xargs -0 -n1 node --check
