apiVersion: v1
kind: ServiceAccount
metadata:
  name: velclaw-publisher
  namespace: velclaw-production
  labels:
    app.kubernetes.io/part-of: velclaw
    app.kubernetes.io/name: publisher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velclaw-publisher
  namespace: velclaw-production
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velclaw-publisher
  namespace: velclaw-production
subjects:
  - kind: ServiceAccount
    name: velclaw-publisher
    namespace: velclaw-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velclaw-publisher
