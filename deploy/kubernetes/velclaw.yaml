apiVersion: v1
kind: ServiceAccount
metadata:
  name: velclaw
  namespace: velclaw-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velclaw
  namespace: velclaw-production
  labels:
    app.kubernetes.io/name: velclaw
    app.kubernetes.io/part-of: velclaw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: velclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velclaw
        app.kubernetes.io/part-of: velclaw
    spec:
      serviceAccountName: velclaw
      imagePullSecrets:
        - name: velclaw-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/velclaw/velclaw:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          envFrom:
            - secretRef:
                name: velclaw-runtime
                optional: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: velclaw
  namespace: velclaw-production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: velclaw
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: velclaw
  namespace: velclaw-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velclaw
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velclaw
  namespace: velclaw-production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - velclaw.com
      secretName: velclaw-tls
  rules:
    - host: velclaw.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: velclaw
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: velclaw
  namespace: velclaw-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velclaw
