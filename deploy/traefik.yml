api:
  dashboard: false

entryPoints:
  web:
    address: ':80'
  websecure:
    address: ':443'

providers:
  docker:
    exposedByDefault: false
    network: velclaw-runtime

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@velclaw.cfd
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
