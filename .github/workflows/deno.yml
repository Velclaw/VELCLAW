name: Deno Project Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect Deno project
        id: detect
        shell: bash
        run: |
          if find . -path './.git' -prune -o \( -name deno.json -o -name deno.jsonc \) -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Deno project configuration found; skipping Deno-specific lint and tests."
          fi
      - name: Setup Deno
        if: steps.detect.outputs.present == 'true'
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31 # v1.1.2
        with:
          deno-version: v1.x
      - name: Run Deno linter
        if: steps.detect.outputs.present == 'true'
        run: deno lint
      - name: Run Deno tests
        if: steps.detect.outputs.present == 'true'
        run: deno test -A
