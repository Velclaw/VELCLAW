name: Velclaw CI Heal

on:
  workflow_run:
    workflows: [Velclaw Release Validation]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed workflow run ID to diagnose
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: velclaw-ci-heal-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  heal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Collect failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          RUN_ID="${EVENT_RUN_ID:-$INPUT_RUN_ID}"
          if [ -z "$RUN_ID" ]; then
            echo 'No workflow run ID supplied.' > failure-report.txt
          else
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,status,conclusion,headSha,headBranch,url,jobs > failure-summary.json || true
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failure-report.txt || true
          fi
          printf '\n=== git status ===\n' >> failure-report.txt
          git status --short >> failure-report.txt

      - name: Re-run failed jobs once
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"

      - name: Wait for the retry window
        if: github.event_name == 'workflow_run'
        run: sleep 15

      - name: Run Codex repair agent
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          output-file: codex-result.txt
          prompt: |
            You are the Velclaw CI repair agent.
            Work only on the trusted main checkout of Velclaw/Velclaw.
            Read AGENTS.md and the repository instructions first.
            Read failure-report.txt and failure-summary.json if present.
            Diagnose the concrete failure, make the smallest safe code/workflow/config change that fixes it,
            and run the narrowest relevant validation locally. Do not invent secrets or credentials.
            Do not modify production secrets. Do not weaken security checks merely to make CI green.
            If the failure is caused by missing infrastructure credentials, improve the workflow so the missing
            infrastructure is an explicit prerequisite or use the supported deployment path instead of silently
            pretending deployment succeeded.
            Leave the working tree with the proposed fix only; do not push or create a pull request yourself.

      - name: Create repair branch and commit
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'Codex produced no repository changes.'
            exit 0
          fi
          BRANCH="automation/ci-heal-${GITHUB_RUN_ID}"
          git config user.name 'Velclaw CI Heal'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m 'fix(ci): automated repair from failed validation'
          git push --set-upstream origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title 'fix(ci): automated repair from failed validation' \
            --body-file codex-result.txt || true

      - name: Open diagnostic issue when repair is unavailable
        if: ${{ secrets.OPENAI_API_KEY == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI failure requires repair agent: run ${RUN_ID}" \
            --body-file failure-report.txt || true
