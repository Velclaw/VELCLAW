name: Velclaw Format Fix

on:
  push:
    branches:
      - fix/prettier-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[format-fix]')"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e289664e5dc5ba9c38
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format TypeScript
        run: pnpm exec prettier --write '**/*.{ts,tsx}'
      - name: Commit formatting changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.ts' '*.tsx'
          git commit -m 'chore(format): normalize TypeScript formatting [format-fix]'
          git push origin HEAD:fix/prettier-format
