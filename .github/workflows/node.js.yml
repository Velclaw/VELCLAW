name: Velclaw Core CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velclaw-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Runtime validation
        run: pnpm validate:runtime

      - name: Lint
        run: pnpm lint

      - name: Normalize formatting
        run: pnpm format

      - name: Commit formatting fixes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "velclaw-ci"
          git config user.email "velclaw-ci@users.noreply.github.com"
          git add -- '*.ts' '*.tsx'
          git commit -m "style: apply prettier formatting"
          git push origin HEAD:main

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build production container
        run: docker build --pull --tag velclaw:ci .

      - name: Inspect production container
        run: docker image inspect velclaw:ci >/dev/null
