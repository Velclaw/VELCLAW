name: grok-review
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Checkout
        if: env.XAI_API_KEY != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Grok CLI
        if: env.XAI_API_KEY != ''
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Review pull request
        if: env.XAI_API_KEY != ''
        run: grok -p "Review this PR for bugs" --always-approve
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Explain skipped review
        if: env.XAI_API_KEY == ''
        run: echo "::notice::Grok review skipped because XAI_API_KEY is not configured."
