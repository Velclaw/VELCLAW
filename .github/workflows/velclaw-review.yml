name: Velclaw Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm type-check

  review:
    name: AI review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Gito
        run: python -m pip install --disable-pip-version-check 'gito.bot~=4.4'

      - name: Run Gito review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_TYPE: ${{ vars.LLM_API_TYPE || 'openai' }}
          MODEL: ${{ vars.LLM_MODEL || 'gpt-5.5' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${LLM_API_KEY:-}" ]; then
            echo "ERROR: GitHub Actions secret LLM_API_KEY is not available. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          gito --verbose review
          gito github-comment --token "$GITHUB_TOKEN"

      - name: Publish review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velclaw-review-report
          path: |
            code-review-report.md
            code-review-report.json
          if-no-files-found: ignore
