name: Autoship CI

on:
  push:
    branches: [main]
    paths:
      - 'Autoship/**'
      - '.github/workflows/autoship-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Autoship/**'
      - '.github/workflows/autoship-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Autoship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run test:runner
      - run: npm run build
      - run: npm run test:api
      - run: docker build -t autoship:ci .
      - run: docker build -f Dockerfile.runner -t autoship-runner:ci .
