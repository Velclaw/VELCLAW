name: Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check for common credential values
        shell: bash
        run: |
          set -euo pipefail
          # Match concrete credential-looking values, not regex definitions,
          # documentation placeholders, or provider validation code.
          pattern='(^|[[:space:]=:("'"'"'`])((sk|ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)($|[[:space:),"'"'"'`])'
          if git grep -nEI "$pattern" -- ':!pnpm-lock.yaml' ':!package-lock.json'; then
            echo 'Potential credential material detected. Remove it and rotate the credential before merging.'
            exit 1
          fi
          echo 'No concrete credential values detected.'
