name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install demo dependencies
        run: python -m pip install -r ZsKai/huggingface-space-kimi-demo/requirements.txt
      - name: Compile Python entrypoints
        run: python -m py_compile ZsKai/huggingface-space-kimi-demo/app.py create_velclaw_transparent_gif.py assets/create_velclaw_transparent_gif.py
