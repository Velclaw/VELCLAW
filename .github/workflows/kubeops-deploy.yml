name: Velclaw KubeOps Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: velclaw-kubeops-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/velclaw/velclaw
  PUBLISHER_IMAGE: ghcr.io/velclaw/velclaw-publisher
  KUBE_NAMESPACE: velclaw-production
  KUBE_DEPLOYMENT: velclaw
  KUBE_PUBLISHER_DEPLOYMENT: velclaw-publisher

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBEOPS_KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client
          kubectl cluster-info

      - name: Install and validate
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm validate:runtime
          pnpm build

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push production images
        run: |
          docker build --pull --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:main" .
          docker build --pull --file deploy/kubernetes-publisher.Dockerfile --tag "$PUBLISHER_IMAGE:${GITHUB_SHA}" --tag "$PUBLISHER_IMAGE:main" deploy
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:main"
          docker push "$PUBLISHER_IMAGE:${GITHUB_SHA}"
          docker push "$PUBLISHER_IMAGE:main"

      - name: Validate Kubernetes resources against API
        run: kubectl apply --dry-run=server -k deploy/kubernetes

      - name: Apply Velclaw Kubernetes resources
        run: kubectl apply -k deploy/kubernetes

      - name: Verify required runtime secrets
        run: |
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-runtime >/dev/null
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-github >/dev/null
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-registry >/dev/null

      - name: Roll out exact commit images
        run: |
          kubectl -n "$KUBE_NAMESPACE" set image deployment/$KUBE_DEPLOYMENT web="$IMAGE:${GITHUB_SHA}"
          kubectl -n "$KUBE_NAMESPACE" set image deployment/$KUBE_PUBLISHER_DEPLOYMENT publisher="$PUBLISHER_IMAGE:${GITHUB_SHA}"
          if ! kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$KUBE_DEPLOYMENT --timeout=8m; then
            kubectl -n "$KUBE_NAMESPACE" rollout undo deployment/$KUBE_DEPLOYMENT
            kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$KUBE_DEPLOYMENT --timeout=5m
            exit 1
          fi
          if ! kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$KUBE_PUBLISHER_DEPLOYMENT --timeout=8m; then
            kubectl -n "$KUBE_NAMESPACE" rollout undo deployment/$KUBE_PUBLISHER_DEPLOYMENT
            kubectl -n "$KUBE_NAMESPACE" rollout status deployment/$KUBE_PUBLISHER_DEPLOYMENT --timeout=5m
            exit 1
          fi

      - name: Verify service health
        run: |
          kubectl -n "$KUBE_NAMESPACE" get deployment,service,ingress,pods -o wide
          kubectl -n "$KUBE_NAMESPACE" get deployment "$KUBE_DEPLOYMENT" -o jsonpath='{.status.availableReplicas}{"/"}{.spec.replicas}{" available\n"}'
          kubectl -n "$KUBE_NAMESPACE" get deployment "$KUBE_PUBLISHER_DEPLOYMENT" -o jsonpath='{.status.availableReplicas}{"/"}{.spec.replicas}{" publisher available\n"}'
