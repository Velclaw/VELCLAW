name: Velclaw KubeOps Secret Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: velclaw-kubeops-secret-bootstrap
  cancel-in-progress: true

env:
  KUBE_NAMESPACE: velclaw-production

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBEOPS_KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
          kubectl get namespace "$KUBE_NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$KUBE_NAMESPACE"

      - name: Bootstrap application runtime secret
        env:
          DEPLOY_TOKEN: ${{ secrets.VELCLAW_DEPLOY_API_TOKEN }}
          POSTGRES_URL: ${{ secrets.VELCLAW_POSTGRES_URL }}
          MODEL_ACCESS_KEY: ${{ secrets.MODEL_ACCESS_KEY }}
          DO_INFERENCE_ROUTER: ${{ secrets.DO_INFERENCE_ROUTER }}
        run: |
          if kubectl -n "$KUBE_NAMESPACE" get secret velclaw-runtime >/dev/null 2>&1; then
            echo 'velclaw-runtime exists; patching only supplied credentials and preserving existing keys.'
            if [ -n "$DEPLOY_TOKEN" ]; then
              encoded="$(printf '%s' "$DEPLOY_TOKEN" | base64 -w0)"
              kubectl -n "$KUBE_NAMESPACE" patch secret velclaw-runtime --type=merge -p "{\"data\":{\"VELCLAW_DEPLOY_API_TOKEN\":\"$encoded\"}}"
            fi
            if [ -n "$POSTGRES_URL" ]; then
              encoded="$(printf '%s' "$POSTGRES_URL" | base64 -w0)"
              kubectl -n "$KUBE_NAMESPACE" patch secret velclaw-runtime --type=merge -p "{\"data\":{\"POSTGRES_URL\":\"$encoded\"}}"
            fi
            if [ -n "$MODEL_ACCESS_KEY" ]; then
              encoded="$(printf '%s' "$MODEL_ACCESS_KEY" | base64 -w0)"
              kubectl -n "$KUBE_NAMESPACE" patch secret velclaw-runtime --type=merge -p "{\"data\":{\"MODEL_ACCESS_KEY\":\"$encoded\"}}"
            fi
            if [ -n "$DO_INFERENCE_ROUTER" ]; then
              encoded="$(printf '%s' "$DO_INFERENCE_ROUTER" | base64 -w0)"
              kubectl -n "$KUBE_NAMESPACE" patch secret velclaw-runtime --type=merge -p "{\"data\":{\"DO_INFERENCE_ROUTER\":\"$encoded\"}}"
            fi
          else
            test -n "$DEPLOY_TOKEN" || DEPLOY_TOKEN="$(openssl rand -base64 48 | tr -d '=+/\n' | cut -c1-64)"
            args=(--from-literal=VELCLAW_DEPLOY_API_TOKEN="$DEPLOY_TOKEN")
            [ -n "$POSTGRES_URL" ] && args+=(--from-literal=POSTGRES_URL="$POSTGRES_URL")
            [ -n "$MODEL_ACCESS_KEY" ] && args+=(--from-literal=MODEL_ACCESS_KEY="$MODEL_ACCESS_KEY")
            [ -n "$DO_INFERENCE_ROUTER" ] && args+=(--from-literal=DO_INFERENCE_ROUTER="$DO_INFERENCE_ROUTER")
            kubectl -n "$KUBE_NAMESPACE" create secret generic velclaw-runtime "${args[@]}"
          fi

      - name: Refresh GitHub and GHCR credentials for publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          kubectl -n "$KUBE_NAMESPACE" create secret generic velclaw-github \
            --from-literal=token="$GITHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$KUBE_NAMESPACE" create secret docker-registry velclaw-registry \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="$GITHUB_TOKEN" \
            --dry-run=client -o json > /tmp/registry-secret.json
          kubectl -n "$KUBE_NAMESPACE" apply -f /tmp/registry-secret.json

      - name: Verify secret contracts without printing values
        run: |
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-runtime -o jsonpath='{.metadata.name}{" ok\n"}'
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-github -o jsonpath='{.metadata.name}{" ok\n"}'
          kubectl -n "$KUBE_NAMESPACE" get secret velclaw-registry -o jsonpath='{.metadata.name}{" ok\n"}'
