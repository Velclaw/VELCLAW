name: Velclaw CI Recovery v2

on:
  push:
    branches:
      - ci/recovery-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: velclaw-ci-recovery-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-probe-slim:
    name: Runner probe / Ubuntu Slim
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: |
          echo "VELCLAW_RUNNER_PROBE=ubuntu-slim"
          uname -a
          node --version

      - name: Checkout
        uses: actions/checkout@v4

  runner-probe-windows:
    name: Runner probe / Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Runner started
        shell: pwsh
        run: |
          Write-Host "VELCLAW_RUNNER_PROBE=windows-latest"
          $PSVersionTable.PSVersion
          node --version

      - name: Checkout
        uses: actions/checkout@v4

  quality:
    name: Node 22 / Quality / Slim
    runs-on: ubuntu-slim
    timeout-minutes: 15
    needs: runner-probe-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker version
        run: docker version

      - name: Build control-plane image
        run: docker build --pull --tag velclaw:ci .

      - name: Inspect image
        run: docker image inspect velclaw:ci >/dev/null

      - name: Verify image metadata
        run: |
          test "$(docker image inspect velclaw:ci --format '{{.Config.ExposedPorts}}')" = "map[3000/tcp:{}]"
          test "$(docker image inspect velclaw:ci --format '{{.Config.User}}')" = "velclaw"
