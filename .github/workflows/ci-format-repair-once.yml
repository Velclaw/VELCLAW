name: One-time Prettier repair

on:
  push:
    branches: ["fix/velclaw-ci-and-dependabot-locks"]

permissions:
  contents: write

concurrency:
  group: prettier-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies without credentials
        run: pnpm install --no-frozen-lockfile

      - name: Format the two CI-blocking files
        run: pnpm exec prettier --write app/deploy/engine/page.tsx tests/vercel-services.test.ts

      - name: Commit formatting changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deploy/engine/page.tsx tests/vercel-services.test.ts
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "style: format files required by CI"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:$GITHUB_REF_NAME"
