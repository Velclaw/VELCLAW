name: Django CI (project detection)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect Django project
        shell: bash
        run: |
          if find . -path './.git' -prune -o -name manage.py -print -quit | grep -q .; then
            echo "Django manage.py found; dedicated Django test workflow must be configured for that project."
          else
            echo "No Django project (manage.py) exists in this repository; Django tests are not applicable."
          fi
