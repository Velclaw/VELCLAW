<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Velclaw documentation"><title>Velclaw Docs</title><link rel="stylesheet" href="docs.css"><style>.doc-brand{display:flex;align-items:center;gap:9px;color:var(--text);font-size:1rem;font-weight:800;letter-spacing:-.06em;text-transform:lowercase}.doc-brand img{width:30px;height:30px;display:block}.reading{height:2px;position:fixed;z-index:200;left:0;top:62px;width:0;background:var(--purple-2);box-shadow:0 0 12px var(--purple);transition:width .08s linear}.doc-kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.doc-kicker .status{margin:0}.doc-lead{max-width:72ch;margin-bottom:28px}.doc-section{position:relative}.doc-section:first-of-type h2{margin-top:30px}.doc-section p{max-width:78ch}.doc-bullets{margin:10px 0 22px;padding-left:20px;color:var(--muted)}.doc-bullets li{padding:4px 0}.code{position:relative}.code code{white-space:pre}.code-head{font-variant-numeric:tabular-nums}.copy.copied{border-color:#4ade80;color:#4ade80;background:transparent}.section-number{display:inline-block;min-width:24px;margin-right:5px;color:var(--dim);font-size:.72em;font-weight:400}.section-anchor{margin-left:6px;color:var(--dim);opacity:0;font-size:.8em}.doc-section h2:hover .section-anchor{opacity:1}.related{display:flex;flex-wrap:wrap;gap:7px;margin-top:42px;padding-top:22px;border-top:1px solid var(--line)}.related-label{width:100%;margin-bottom:2px;color:var(--dim);font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.related a,.pager a{border:1px solid var(--line-strong);padding:7px 10px;color:var(--muted);font-size:.68rem}.related a:hover,.pager a:hover{border-color:var(--purple);color:var(--purple-2);background:var(--purple-soft)}.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}.pager a{display:block;min-height:52px}.pager a:last-child{text-align:right}.pager small{display:block;margin-bottom:3px;color:var(--dim);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em}.pager strong{font-size:.7rem;color:var(--text)}.loading{color:var(--dim)}@media(max-width:760px){.reading{top:112px}.pager{grid-template-columns:1fr}.pager a:last-child{text-align:left}.doc-section h2{scroll-margin-top:132px}.section-anchor{opacity:1}}</style></head><body class="docs-page"><div class="reading" id="reading-progress"></div><header class="topbar"><button class="menu-toggle" id="menu-toggle" type="button" aria-label="Mở menu" aria-expanded="false"><span></span><span></span><span></span></button><a class="wordmark doc-brand" href="index.html"><img src="assets/velclaw-animated-mark.svg" alt="Velclaw"><span>velclaw</span></a><div class="top-actions"><label class="search" aria-label="Search documentation"><span>⌕</span><input id="doc-search" type="search" placeholder="Tìm kiếm..." autocomplete="off"><kbd>⌘K</kbd></label><a href="index.html">Docs</a><a id="github" href="https://github.com/Velclaw/Velclaw" target="_blank" rel="noreferrer">GitHub ↗</a><button class="theme-toggle" id="theme-toggle" type="button">☼</button><select id="language" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option></select></div></header><div class="docs-layout"><aside class="sidebar"><div class="drawer-head"><strong>Xem tài liệu</strong><button class="drawer-close" id="drawer-close" type="button" aria-label="Đóng menu">×</button></div><div class="sidebar-title">Phần</div><nav id="sidebar-nav"></nav><div class="sidebar-toc"><div class="sidebar-toc-title">Trong phần này</div><nav id="mobile-toc-list"></nav></div></aside><main class="doc-main"><div class="breadcrumbs"><a href="index.html">Bắt đầu</a><span>/</span><strong id="crumb">Velclaw</strong></div><div class="reader-actions"><button class="copy-page" id="copy-page" type="button">▣ &nbsp; Sao chép trang</button></div><article id="content"><p class="loading">Đang tải tài liệu…</p></article></main><aside class="toc"><div class="toc-title">Trong phần này</div><nav id="toc-list"></nav></aside></div><footer class="doc-footer"><span>VELCLAW</span><span>Source-traceable documentation · verified</span></footer><script src="ui-polish.js"></script><script>
const slugs=window.VELCLAW_DOCS;const labels=window.VELCLAW_LABELS;const ui={en:{copy:'Copy',copied:'Copied',page:'Copy page',available:'Available',preview:'Preview',related:'Related',prev:'Previous',next:'Next'},vi:{copy:'Sao chép',copied:'Đã sao chép',page:'Sao chép trang',available:'Đã có',preview:'Preview',related:'Liên quan',prev:'Trước',next:'Tiếp'}};let lang='vi',docData=null,currentSlug='getting-started';
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function sectionId(sec,i){return sec.slug||'section-'+(i+1)}function hrefFor(slug,l=lang){return `doc.html?doc=${encodeURIComponent(slug)}&lang=${l}`}function resolveRoute(){const p=new URLSearchParams(location.search);const hash=decodeURIComponent(location.hash.replace(/^#/,'')).replace(/^\//,'');const doc=p.get('doc')||hash||'getting-started';const l=p.get('lang')||localStorage.getItem('velclaw-language')||'vi';return{doc,lang:l}}function renderSection(sec,i){const id=sectionId(sec,i);return `<section class="doc-section" id="${esc(id)}"><h2><span class="section-number">${String(i+1).padStart(2,'0')}</span>${esc(sec.heading)} <a class="section-anchor" href="#${esc(id)}" aria-label="Anchor">#</a></h2>`+(sec.body||[]).map(x=>`<p>${esc(x)}</p>`).join('')+(sec.bullets?.length?`<ul class="doc-bullets">${sec.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'')+(sec.examples||[]).map(x=>`<div class="code"><div class="code-head"><span>${esc(x.language||'text')}</span><button class="copy" data-code="${encodeURIComponent(x.code||'')}" data-copied="${ui[lang].copied}">${ui[lang].copy}</button></div><pre><code>${esc(x.code||'')}</code></pre></div>`).join('')+'</section>'}function navLink(slug,label,active){return `<a class="side-link ${active?'active':''}" href="${hrefFor(slug)}">${esc(label)}</a>`}function pagerHtml(){const i=slugs.indexOf(currentSlug),prev=i>0?slugs[i-1]:null,next=i<slugs.length-1?slugs[i+1]:null;return `<nav class="pager" aria-label="Document navigation">${prev?`<a href="${hrefFor(prev)}"><small>← ${ui[lang].prev}</small><strong>${esc(labels[lang][prev])}</strong></a>`:'<span></span>'}${next?`<a href="${hrefFor(next)}"><small>${ui[lang].next} →</small><strong>${esc(labels[lang][next])}</strong></a>`:'<span></span>'}</nav>`}function updateProgress(){const d=document.documentElement,max=d.scrollHeight-d.clientHeight;document.getElementById('reading-progress').style.width=(max>0?(window.scrollY/max)*100:0)+'%'}
async function load(){const data=await(await fetch('./data.json')).json();const route=resolveRoute();lang=data.translations[route.lang]?route.lang:'vi';localStorage.setItem('velclaw-language',lang);currentSlug=slugs.includes(route.doc)?route.doc:'getting-started';document.documentElement.lang=lang;document.getElementById('language').value=lang;document.getElementById('github').href=data.product.repository;document.getElementById('sidebar-nav').innerHTML=slugs.map(x=>navLink(x,labels[lang][x],x===currentSlug)).join('');const r=await fetch(`./docs/${lang}/${currentSlug}.json`);if(!r.ok)throw Error('Document not found');docData=await r.json();document.title=`${docData.title} — Velclaw Docs`;document.getElementById('crumb').textContent=docData.title;const sections=docData.sections||[],toc=sections.map((x,i)=>`<a href="#${esc(sectionId(x,i))}">${esc(x.heading)}</a>`).join('');document.getElementById('content').innerHTML=`<div class="doc-kicker"><span class="doc-eyebrow">${esc(docData.category||'Documentation')}</span><span class="status ${docData.status||'available'}">${ui[lang][docData.status]||docData.status||ui[lang].available}</span></div><h1>${esc(docData.title)}</h1><p class="summary doc-lead">${esc(docData.summary||'')}</p>${sections.map(renderSection).join('')}${docData.relatedLinks?.length?`<div class="related"><div class="related-label">${ui[lang].related}</div>${docData.relatedLinks.map(x=>`<a href="${hrefFor(x.id)}">${esc(x.label)}</a>`).join('')}</div>`:''}${pagerHtml()}`;document.getElementById('toc-list').innerHTML=toc;document.getElementById('mobile-toc-list').innerHTML=toc;document.getElementById('copy-page').textContent='▣  '+ui[lang].page;bindCopyButtons();bindToc();updateProgress();if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView()}
function bindCopyButtons(){document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(decodeURIComponent(b.dataset.code||''))}catch{return}const old=b.textContent;b.textContent='✓ '+b.dataset.copied;b.classList.add('copied');setTimeout(()=>{b.textContent=old;b.classList.remove('copied')},1200)}))}function bindToc(){const links=[...document.querySelectorAll('#toc-list a')],sections=links.map(a=>document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);if(!links.length)return;const update=()=>{let active=0;const y=scrollY+120;sections.forEach((s,i)=>{if(s.offsetTop<=y)active=i});links.forEach((a,i)=>a.classList.toggle('active',i===active));document.querySelectorAll('#mobile-toc-list a').forEach((a,i)=>a.classList.toggle('active',i===active))};addEventListener('scroll',update,{passive:true});update()}document.getElementById('language').onchange=e=>{localStorage.setItem('velclaw-language',e.target.value);location.href=hrefFor(currentSlug,e.target.value)};document.getElementById('copy-page').onclick=async()=>{if(!docData)return;const text=[docData.title,docData.summary,...(docData.sections||[]).flatMap(s=>[s.heading,...(s.body||[]),...(s.bullets||[]),...(s.examples||[]).map(e=>e.code)])].join('\n\n');try{await navigator.clipboard.writeText(text)}catch{return}const b=document.getElementById('copy-page'),old=b.textContent;b.textContent='✓  '+ui[lang].copied;setTimeout(()=>b.textContent=old,1200)};addEventListener('scroll',updateProgress,{passive:true});load().catch(e=>document.getElementById('content').innerHTML=`<div class="notice"><strong>Không thể tải tài liệu.</strong><p>${esc(e.message)}</p></div>`);
</script></body></html>
