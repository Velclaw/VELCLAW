<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tài khoản — Velclaw</title><link rel="stylesheet" href="../docs.css"><style>main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:30px}.card{width:min(500px,100%);border:1px solid var(--line);background:var(--surface);padding:30px}.ey{color:var(--purple-2);font-size:.65rem;font-weight:800;letter-spacing:.15em}h1{font-size:2.5rem;letter-spacing:-.06em;margin:12px 0}.muted{color:var(--muted);font-size:.78rem;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px;margin:10px 0}.field.full{grid-column:1/-1}.field label{font-size:.67rem;font-weight:700}.field input{padding:12px;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:8px;font:inherit}.actions{display:grid;gap:8px;margin-top:18px}.button{text-align:center}.legal{font-size:.58rem;color:var(--dim);line-height:1.6;margin-top:18px}@media(max-width:520px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="topbar"><a class="wordmark home-brand" href="../index.html"><img src="../assets/velclaw-animated-mark.svg" alt="Velclaw"><span>velclaw</span></a><div class="top-actions"><a href="../velclawhub.html">Hub</a><a href="../index.html">Docs</a><button class="theme-toggle" id="theme-toggle" type="button">☼</button><select id="language" aria-label="Ngôn ngữ"><option>VI</option><option>EN</option></select></div></header><main><section class="card"><div class="ey">VELCLAW ID</div><h1>Tạo tài khoản.</h1><p class="muted">Một tài khoản cho Velclaw, VelclawHub và Velclaw Code.</p><form id="signup"><div class="grid"><div class="field"><label>Họ và tên</label><input required autocomplete="name" placeholder="Tên của bạn"></div><div class="field"><label>Tên người dùng</label><input required autocomplete="username" placeholder="velclaw_user"></div><div class="field full"><label>Email</label><input type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Mật khẩu</label><input type="password" required minlength="8" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự"></div><div class="field"><label>Xác nhận mật khẩu</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Nhập lại mật khẩu"></div></div><div class="actions"><button class="button" type="submit">Tạo tài khoản</button></div></form><p class="muted">Đã có tài khoản? <a href="auth.html">Đăng nhập →</a></p><p class="legal">Bản giao diện hiện tại chưa tạo tài khoản thật. Backend xác thực, mã hóa mật khẩu, session và xác minh email sẽ được triển khai trước khi production.</p></section></main><script src="../ui-polish.js"></script><script>document.querySelector('#signup').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(document.querySelector('#confirm').value!==f.querySelector('input[type=password]').value){alert('Mật khẩu xác nhận không khớp.');return}alert('Giao diện đăng ký đã sẵn sàng. Backend authentication sẽ được nối ở bước tiếp theo.')});</script></body></html>
